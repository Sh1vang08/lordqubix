name: Keep Supabase project awake

# Free-tier Supabase projects auto-pause after 7 days with no API activity,
# which took the admin panel offline (DNS for the project stopped
# resolving). This does one trivial read every 3 days — comfortably inside
# the 7-day window even if a run is skipped or delayed — so the project
# always looks "recently used" and never pauses.
on:
  schedule:
    - cron: "0 6 */3 * *" # 06:00 UTC, every 3rd day
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/families?select=slug&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase responded with HTTP $status"
          # 2xx means the project is awake and answering queries. Anything
          # else (including a DNS failure, which curl reports as its own
          # non-2xx exit before this even runs) fails the job so it shows up
          # as a red X in the Actions tab rather than failing silently.
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Unexpected status from Supabase: $status"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
